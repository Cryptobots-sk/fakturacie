<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>{{ title }} · Fakturácie</title><link rel="stylesheet" href="{{ basePath }}/assets/app.css"><script src="{{ basePath }}/assets/app.js" defer></script></head>
<body>
<a href="#main" class="skip-link">Preskočiť na obsah</a>
<header class="app-header border-bottom bg-white"><div class="container-xxl d-flex align-items-center justify-content-between gap-3 py-3 flex-wrap">
<a href="/" class="brand d-flex align-items-center gap-2 text-decoration-none text-body"><span class="brand__mark" aria-hidden="true">c.</span><span class="fw-semibold">fakturácie<span class="brand__company d-none d-sm-block small text-secondary fw-normal">Cryptobots</span></span></a>
<nav aria-label="Hlavná navigácia" class="nav gap-1 gap-sm-3"><a href="/" class="nav-link px-2 {% if page == 'invoices' %}active{% endif %}"{% if page == 'invoices' %} aria-current="page"{% endif %}>Faktúry</a><a href="/zakaznici" class="nav-link px-2 {% if page == 'customers' %}active{% endif %}"{% if page == 'customers' %} aria-current="page"{% endif %}>Zákazníci</a><a href="/nastavenia" class="nav-link px-2 {% if page == 'settings' %}active{% endif %}"{% if page == 'settings' %} aria-current="page"{% endif %}>Moja firma</a></nav>
</div></header>
<main id="main" class="container-xxl py-4 py-lg-5" tabindex="-1">{% block content %}{% endblock %}</main>
<div id="notification" class="notification border rounded-3 bg-white p-3 shadow-sm" role="status" aria-live="polite" hidden></div>
<dialog id="confirm-dialog" class="app-dialog border-0 rounded-3 p-4"><form method="dialog"><h2 id="confirm-title" class="h4 mb-3">Potvrdiť</h2><p id="confirm-text" class="text-secondary"></p><div class="d-flex gap-2 justify-content-end mt-4"><button class="btn btn-light" value="cancel" autofocus>Späť</button><button class="btn btn-primary" value="confirm" id="confirm-action">Potvrdiť</button></div></form></dialog>
<script type="application/json" id="app-data">{{ bootJson|safe }}</script>
</body></html>
